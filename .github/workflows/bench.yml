name: Cross-Language Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode: quick or full'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
      benches:
        description: 'Specific benchmarks to run (comma-separated, empty for all in mode)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform_id: linux-arm64
            target: linux-arm64
            os_name: Linux
            arch_name: arm64
            pattern: "*linux-arm64*.tar.gz"
            archive_type: tar
            allow_failure: false

          - name: Linux x86_64
            os: ubuntu-latest
            platform_id: linux-x64
            target: linux-x64
            os_name: Linux
            arch_name: x86_64
            pattern: "*linux-x64*.tar.gz"
            archive_type: tar
            allow_failure: false

          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            platform_id: macos-arm64
            target: macos-arm64
            os_name: macOS
            arch_name: arm64
            pattern: "*macos-arm64*.tar.gz"
            archive_type: tar
            allow_failure: false

          - name: macOS x86_64 (Intel)
            os: macos-15-intel
            platform_id: macos-x64
            target: macos-x64
            os_name: macOS
            arch_name: x86_64
            pattern: "*macos-x64*.tar.gz"
            archive_type: tar
            allow_failure: true

          - name: Windows x86_64
            os: windows-latest
            platform_id: windows-x64
            target: windows-x64
            os_name: Windows
            arch_name: x86_64
            pattern: "*windows-x64*.zip"
            archive_type: zip
            allow_failure: false

          - name: Windows ARM64
            os: windows-11-arm
            platform_id: windows-arm64
            target: windows-arm64
            os_name: Windows
            arch_name: arm64
            pattern: "*windows-arm64*.zip"
            archive_type: zip
            allow_failure: true

    defaults:
      run:
        shell: bash
        working-directory: bench

    steps:
      - name: Checkout bench suite
        uses: actions/checkout@v6
        with:
          path: bench

      - name: Checkout Xu compiler
        uses: actions/checkout@v6
        with:
          repository: xulang-org/xu
          path: xu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Clang & OS tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install / Resolve Xu compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../xu/bin /tmp/xu-sdk
          XU_VER=$(tr -d '[:space:]' < ../xu/VERSION)
          TAG="v$XU_VER"
          echo "Targeting exact Xu SDK tag: $TAG, pattern: ${{ matrix.pattern }}"
          gh release download "$TAG" --repo xulang-org/xu --pattern "${{ matrix.pattern }}" --dir /tmp/xu-sdk || \
          gh release download --repo xulang-org/xu --pattern "${{ matrix.pattern }}" --dir /tmp/xu-sdk || true
          
          if [ "${{ matrix.archive_type }}" = "tar" ]; then
            if ls /tmp/xu-sdk/*.tar.gz 1> /dev/null 2>&1; then
              tar -xzf /tmp/xu-sdk/*.tar.gz -C /tmp/xu-sdk/
              SDK_DIR=$(find /tmp/xu-sdk -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -r "$SDK_DIR"/bin/* ../xu/bin/ || true
              chmod +x ../xu/bin/xu || true
            fi
          else
            if ls /tmp/xu-sdk/*.zip 1> /dev/null 2>&1; then
              unzip -q -o /tmp/xu-sdk/*.zip -d /tmp/xu-sdk/unpacked
              SDK_DIR=$(find /tmp/xu-sdk/unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -r "$SDK_DIR"/bin/* ../xu/bin/ || true
            fi
          fi

          if [ ! -f ../xu/bin/xu ] && [ ! -f ../xu/bin/xu.exe ]; then
            echo "Compiler not found from download, attempting build from source..."
            cd ../xu && make build && cd - || true
          fi

          XU_BIN="../xu/bin/xu"
          if [ -f "../xu/bin/xu.exe" ]; then
            XU_BIN="../xu/bin/xu.exe"
          fi
          "$XU_BIN" --version

      - name: Run cross-language benchmarks
        run: |
          mkdir -p reports
          INPUT_MODE="${{ github.event.inputs.mode }}"
          MODE="${INPUT_MODE:-quick}"
          BENCH_FLAG=""
          if [ -n "${{ github.event.inputs.benches }}" ]; then
            BENCH_FLAG="--benches=${{ github.event.inputs.benches }}"
          elif [ "$MODE" = "quick" ]; then
            BENCH_FLAG="--quick --benches=startup,loop_sum,fib,nested_loop,method_sum,f64_sum,matmul,string_build,sroa_vec3,copy_bytes,chan_ping,sha256_chain,aes128_encrypt"
          fi
          echo "Running cross-language benchmark with mode: $MODE $BENCH_FLAG"
          python3 scripts/bench_crosslang.py --out reports/crosslang.txt $BENCH_FLAG

      - name: Format summary & JSON payload
        run: |
          XU_BIN="../xu/bin/xu"
          if [ -f "../xu/bin/xu.exe" ]; then
            XU_BIN="../xu/bin/xu.exe"
          fi
          VERSION=$("$XU_BIN" --version 2>/dev/null | awk '{print $2}' || echo "0.8.8")
          python3 scripts/format_summary.py \
            -i reports/crosslang.txt \
            -j "reports/benchmarks-${{ matrix.platform_id }}.json" \
            -s reports/github_summary.md \
            --xu-version "$VERSION" \
            --os "${{ matrix.os_name }}" \
            --arch "${{ matrix.arch_name }}" \
            --platform-id "${{ matrix.platform_id }}" \
            --platform-name "${{ matrix.name }}"

      - name: Publish GitHub Step Summary
        run: |
          if [ -f reports/github_summary.md ]; then
            cat reports/github_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload platform benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-${{ matrix.platform_id }}
          path: |
            bench/reports/crosslang.txt
            bench/reports/benchmarks-${{ matrix.platform_id }}.json
            bench/reports/github_summary.md

  aggregate:
    name: Aggregate Multi-Arch Results
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: bench
    steps:
      - name: Checkout bench suite
        uses: actions/checkout@v6
        with:
          path: bench

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: bench/all-reports
          pattern: benchmark-reports-*
          merge-multiple: false

      - name: Merge platform benchmarks and generate overview
        run: |
          mkdir -p reports
          python3 scripts/format_summary.py \
            --merge-dir all-reports \
            --json-out reports/benchmarks-all.json \
            --summary-out reports/multi_arch_summary.md

      - name: Publish Multi-Arch Step Summary
        run: |
          if [ -f reports/multi_arch_summary.md ]; then
            cat reports/multi_arch_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged multi-arch benchmark dataset
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-all-matrix
          path: |
            bench/reports/benchmarks-all.json
            bench/reports/multi_arch_summary.md
