name: Cross-Language Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode: quick or full'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
      benches:
        description: 'Specific benchmarks to run (comma-separated, empty for all in mode)'
        required: false
        default: ''
      xu_ref:
        description: 'Xu commit or ref to rebuild and benchmark'
        required: false
        default: 'main'
      seed_version:
        description: 'Published SDK seed tag; empty selects the latest published SDK'
        required: false
        default: ''

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  XU_CI_LANE: product
  XU_BOUNDARY_CI: '1'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-xu:
    name: Resolve the Xu commit once for every platform
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the requested Xu ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          XU_REF: ${{ github.event.inputs.xu_ref || 'main' }}
        run: |
          SHA=$(gh api "repos/xulang-org/xu/commits/$XU_REF" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Xu source commit: $SHA"

  benchmark:
    needs: resolve-xu
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform_id: linux-arm64
            target: linux-arm64
            os_name: Linux
            arch_name: arm64
            pattern: "*linux-arm64*.tar.gz"
            archive_type: tar
            allow_failure: false

          - name: Linux x86_64
            os: ubuntu-latest
            platform_id: linux-x64
            target: linux-x64
            os_name: Linux
            arch_name: x86_64
            pattern: "*linux-x64*.tar.gz"
            archive_type: tar
            allow_failure: false

          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            platform_id: macos-arm64
            target: macos-arm64
            os_name: macOS
            arch_name: arm64
            pattern: "*macos-arm64*.tar.gz"
            archive_type: tar
            allow_failure: false

          - name: macOS x86_64 (Intel)
            os: macos-15-intel
            platform_id: macos-x64
            target: macos-x64
            os_name: macOS
            arch_name: x86_64
            pattern: "*macos-x64*.tar.gz"
            archive_type: tar
            allow_failure: true

          - name: Windows x86_64
            os: windows-latest
            platform_id: windows-x64
            target: windows-x64
            os_name: Windows
            arch_name: x86_64
            pattern: "*windows-x64*.zip"
            archive_type: zip
            allow_failure: false

          - name: Windows ARM64
            os: windows-11-arm
            platform_id: windows-arm64
            target: windows-arm64
            os_name: Windows
            arch_name: arm64
            pattern: "*windows-arm64*.zip"
            archive_type: zip
            allow_failure: true

    defaults:
      run:
        shell: bash
        working-directory: bench

    steps:
      - name: Checkout bench suite
        uses: actions/checkout@v6
        with:
          path: bench

      - name: Checkout Xu compiler
        uses: actions/checkout@v6
        with:
          repository: xulang-org/xu
          path: xu
          ref: ${{ needs.resolve-xu.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Clang & OS tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Rebuild the selected Xu commit from a published hosted seed
        env:
          GH_TOKEN: ${{ github.token }}
          XU_SDK_SEED_VERSION: ${{ github.event.inputs.seed_version }}
          XU_BENCH_TARGET: ${{ matrix.target }}
        run: |
          EXE=xu
          if [[ "$XU_BENCH_TARGET" == windows-* ]]; then EXE=xu.exe; fi
          mkdir -p reports ../bench-compiler
          cd ../xu
          python3 scripts/restore_product_seed.py --target "$XU_BENCH_TARGET" --destination "bin/$EXE"
          XU_SKIP_CROSS=1 scripts/build_hosted_chain.sh --candidate-only "bin/$EXE" "../bench-compiler/$EXE"
          python3 scripts/check_release_identity.py --xu "../bench-compiler/$EXE" --require-cli
          python3 scripts/check_bootstrap_xu_boundary.py --ci --strict-freeze --json > ../bench-compiler/source-boundary.json
          CLOSURE=$(python3 -c 'import json; print(json.load(open("../bench-compiler/source-boundary.json"))["source_manifest"]["closure_sha256"])')
          python3 scripts/verify_product_provenance.py "../bench-compiler/$EXE" --source-closure-sha256 "$CLOSURE"
          cd ../bench
          XU_BIN="../bench-compiler/$EXE"
          echo "XU_BIN=$XU_BIN" >> "$GITHUB_ENV"
          "$XU_BIN" --version
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          target = os.environ['XU_BENCH_TARGET']
          compiler = Path('../bench-compiler') / ('xu.exe' if target.startswith('windows-') else 'xu')
          provenance = dict(line.split('=', 1) for line in Path(str(compiler) + '.provenance').read_text().splitlines() if '=' in line)
          identity = {
              'xu_commit': subprocess.check_output(['git', '-C', '../xu', 'rev-parse', 'HEAD'], text=True).strip(),
              'bench_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'xu_version': Path('../xu/VERSION').read_text().strip(),
              'target': target,
              'compiler_sha256': hashlib.sha256(compiler.read_bytes()).hexdigest(),
              'source_closure_sha256': provenance['source_closure_sha256'],
              'seed_sha256': provenance['seed_sha256'],
              'fixed_point_pair': provenance['fixed_point_pair'],
          }
          Path('reports/compiler-identity.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(identity, indent=2))
          PY

      - name: Run cross-language benchmarks
        run: |
          mkdir -p reports
          INPUT_MODE="${{ github.event.inputs.mode }}"
          MODE="${INPUT_MODE:-quick}"
          BENCH_FLAG=""
          if [ -n "${{ github.event.inputs.benches }}" ]; then
            BENCH_FLAG="--benches=${{ github.event.inputs.benches }}"
          elif [ "$MODE" = "quick" ]; then
            BENCH_FLAG="--quick --benches=startup,loop_sum,fib,nested_loop,method_sum,f64_sum,matmul,string_build,sroa_vec3,copy_bytes,chan_ping,sha256_chain,aes128_encrypt"
          fi
          echo "Running cross-language benchmark with mode: $MODE $BENCH_FLAG"
          python3 scripts/bench_crosslang.py --xu "$XU_BIN" --out reports/crosslang.txt $BENCH_FLAG

      - name: Format summary & JSON payload
        run: |
          VERSION=$(tr -d '[:space:]' < ../xu/VERSION)
          python3 scripts/format_summary.py \
            -i reports/crosslang.txt \
            -j "reports/benchmarks-${{ matrix.platform_id }}.json" \
            -s reports/github_summary.md \
            --xu-version "$VERSION" \
            --os "${{ matrix.os_name }}" \
            --arch "${{ matrix.arch_name }}" \
            --platform-id "${{ matrix.platform_id }}" \
            --platform-name "${{ matrix.name }}"

      - name: Publish GitHub Step Summary
        run: |
          if [ -f reports/github_summary.md ]; then
            cat reports/github_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload platform benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-${{ matrix.platform_id }}
          path: |
            bench/reports/crosslang.txt
            bench/reports/benchmarks-${{ matrix.platform_id }}.json
            bench/reports/github_summary.md
            bench/reports/compiler-identity.json

  aggregate:
    name: Aggregate Multi-Arch Results
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: bench
    steps:
      - name: Checkout bench suite
        uses: actions/checkout@v6
        with:
          path: bench

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: bench/all-reports
          pattern: benchmark-reports-*
          merge-multiple: false

      - name: Merge platform benchmarks and generate overview
        run: |
          mkdir -p reports
          python3 scripts/format_summary.py \
            --merge-dir all-reports \
            --json-out reports/benchmarks-all.json \
            --summary-out reports/multi_arch_summary.md

      - name: Publish Multi-Arch Step Summary
        run: |
          if [ -f reports/multi_arch_summary.md ]; then
            cat reports/multi_arch_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged multi-arch benchmark dataset
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-all-matrix
          path: |
            bench/reports/benchmarks-all.json
            bench/reports/multi_arch_summary.md
