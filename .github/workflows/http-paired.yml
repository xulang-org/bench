name: HTTP poll readiness and resume latency
on:
  push:
    branches: [codex/http-short-connection-ab-20261121]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: macos-15, target: macos-arm64}
          - {image: macos-15-intel, target: macos-x64}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with: {path: bench}
      - uses: actions/checkout@v6
        with:
          repository: xulang-org/xu
          ref: bcd7d3e62f075bd8eb07391e78024fe6bd7fbf60
          path: dev
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: 'stable', cache: false}
      - name: Build isolated runtime counters and client
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          XU_SDK_SEED_VERSION: v0.13.1
          XU_SKIP_CROSS: '1'
          XU_CI_LANE: product
        run: |
          set -eu
          mkdir out
          cd dev
          python3 scripts/restore_product_seed.py --target "$TARGET" --destination bin/xu
          scripts/build_hosted_chain.sh --candidate-only bin/xu "$GITHUB_WORKSPACE/out/compiler-dev"
          cd ..
          python3 bench/scripts/http_poll_diag.py configure
          dev/scripts/run_product_compiler.sh "$GITHUB_WORKSPACE/out/compiler-dev" build "$GITHUB_WORKSPACE/out/diagnostic.xu" -o "$GITHUB_WORKSPACE/out/diagnostic"
          go build -o out/go-peer out/peer.go
      - name: Measure readiness outside benchmark timing
        run: python3 -u bench/scripts/http_poll_diag.py diagnose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poll-diagnostic-${{ matrix.target }}
          path: |
            out/*.jsonl
            out/tcpdump.log
