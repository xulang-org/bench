name: HTTP short-connection client phases
on:
  push:
    branches: [codex/http-short-connection-ab-20261121]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: macos-15, target: macos-arm64}
          - {image: macos-15-intel, target: macos-x64}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with: {path: bench}
      - uses: actions/checkout@v6
        with:
          repository: xulang-org/xu
          ref: bcd7d3e62f075bd8eb07391e78024fe6bd7fbf60
          path: dev
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: 'stable', cache: false}
      - name: Build the dev compiler and client probes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          XU_SDK_SEED_VERSION: v0.13.1
          XU_SKIP_CROSS: '1'
          XU_CI_LANE: product
        run: |
          set -eu
          mkdir out
          python3 bench/scripts/short_connection_phases.py sources
          cd dev
          python3 scripts/restore_product_seed.py --target "$TARGET" --destination bin/xu
          scripts/build_hosted_chain.sh --candidate-only bin/xu "$GITHUB_WORKSPACE/out/compiler-dev"
          scripts/run_product_compiler.sh "$GITHUB_WORKSPACE/out/compiler-dev" build "$GITHUB_WORKSPACE/out/xu-phases.xu" -o "$GITHUB_WORKSPACE/out/xu-phases"
          cd ..
          go build -o out/go-peer out/peer.go
          go build -o out/go-phases out/go-phases.go
      - name: Measure Xu and Go client phases against the same Go service
        run: python3 -u bench/scripts/short_connection_phases.py measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-phases-${{ matrix.target }}
          path: |
            out/*.jsonl
            out/*.provenance
