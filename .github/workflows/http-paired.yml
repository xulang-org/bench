name: HTTP short-connection paired measurements
on:
  push:
    branches: [codex/http-short-connection-ab-20261121]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: macos-15, target: macos-arm64}
          - {image: macos-15-intel, target: macos-x64}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with: {path: bench}
      - uses: actions/checkout@v6
        with:
          repository: xulang-org/xu
          ref: 1597f029c1fae39c42a710b0182bcf8ab80a6bbf
          path: base
      - uses: actions/checkout@v6
        with:
          repository: xulang-org/xu
          ref: codex/darwin-poll-waiters
          path: dev
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version: 'stable', cache: false}
      - name: Prepare both compilers and workloads
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          XU_SDK_SEED_VERSION: v0.13.1
          XU_SKIP_CROSS: '1'
          XU_CI_LANE: product
        run: |
          set -eu
          mkdir out
          sw_vers
          uname -m
          go version
          python3 bench/scripts/paired_http_probe.py sources
          cd base
          python3 scripts/restore_product_seed.py --target "$TARGET" --destination bin/xu
          cd ..
          for tree in base dev; do
            (cd "$tree"
             scripts/build_hosted_chain.sh --candidate-only "$GITHUB_WORKSPACE/base/bin/xu" "$GITHUB_WORKSPACE/out/compiler-$tree"
             for variant in original server client; do
               source="$GITHUB_WORKSPACE/out/$variant.xu"
               if test "$variant" = original; then source="$GITHUB_WORKSPACE/bench/tests/bench/http_concurrent.xu"; fi
               scripts/run_product_compiler.sh "$GITHUB_WORKSPACE/out/compiler-$tree" build "$source" -o "$GITHUB_WORKSPACE/out/$tree-$variant"
             done)
          done
          go build -o out/go-original bench/tests/bench/cross/http_concurrent.go
          go build -o out/go-peer out/peer.go
      - name: Compare whole programs and independent client and server
        run: python3 -u bench/scripts/paired_http_probe.py measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-paired-${{ matrix.target }}
          path: |
            out/*.jsonl
            out/*.provenance
